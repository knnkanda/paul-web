<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paulがつくる、学びを少し楽しくする小さなアプリのコレクション。" />
    <title>Learning Lab — 学びを、遊びに。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Learning Lab ホーム">
        <span class="brand-mark">L</span>
        <span>Learning Lab</span>
      </a>
      <a class="header-link" href="#apps">アプリ一覧 <span aria-hidden="true">↘</span></a>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow"><span class="eyebrow-dot"></span> SMALL TOOLS, BIG LEARNING</p>
          <h1 id="hero-title">学びを、<em>遊びに。</em></h1>
          <p class="hero-lede">考えることが少し楽しくなる、<br class="mobile-break" />小さな学習アプリを集めています。</p>
          <a class="hero-cta" href="#apps">アプリを探す <span>↓</span></a>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="art-sun"></div>
          <div class="art-orbit orbit-one"></div>
          <div class="art-orbit orbit-two"></div>
          <div class="art-card card-back">×  7  ＝  35</div>
          <div class="art-card card-front"><span>3</span> × <span>4</span> ＝ ?</div>
          <div class="art-spark spark-one">✦</div>
          <div class="art-spark spark-two">✧</div>
        </div>
      </section>

      <section class="app-section" id="apps" aria-labelledby="apps-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">COLLECTION</p>
            <h2 id="apps-title">学習アプリ一覧</h2>
          </div>
          <p class="section-note"><span id="result-count">2</span> apps</p>
        </div>

        <div class="filter-bar">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <span class="sr-only">アプリを検索</span>
            <input id="search-input" type="search" placeholder="アプリ名やキーワードで検索" autocomplete="off" />
          </label>
          <div class="tag-list" id="tag-list" aria-label="タグで絞り込む"></div>
        </div>

        <div class="app-grid" id="app-grid"></div>
        <p class="empty-state" id="empty-state" hidden>条件に合うアプリがありません。別のキーワードで探してみてください。</p>
      </section>

      <section class="coming-soon" aria-label="新しいアプリについて">
        <span class="coming-icon">＋</span>
        <div><p class="eyebrow">MORE TO COME</p><p>新しいアプリも、少しずつ追加していきます。</p></div>
      </section>
    </main>

    <footer class="site-footer"><span>Learning Lab</span><span>Made with curiosity.</span></footer>
    <script src="app-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
